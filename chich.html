<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Chick Rearing System</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f4f7fc;
    }

    header{
        background:#2c3e50;
        color:white;
        text-align:center;
        padding:20px;
    }

    .container{
        width:90%;
        margin:20px auto;
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
        gap:20px;
    }

    .card{
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
        text-align:center;
    }

    .value{
        font-size:40px;
        color:#27ae60;
        margin:15px 0;
    }

    .status{
        color:green;
        font-weight:bold;
    }

    button{
        background:#3498db;
        color:white;
        border:none;
        padding:10px 20px;
        border-radius:5px;
        cursor:pointer;
    }

    button:hover{
        background:#2980b9;
    }
</style>
</head>
<body>

<header>
    <h1>Smart Chick Rearing System</h1>
    <p>Automatic Food & Water Supply Monitoring Dashboard</p>
</header>

<div class="container">

    <div class="card">
        <h2>Food Level</h2>
        <div class="value" id="food">100%</div>
        <p>Automatic feeder status</p>
    </div>

    <div class="card">
        <h2>Water Level</h2>
        <div class="value" id="water">100%</div>
        <p>Automatic watering system</p>
    </div>

    <div class="card">
        <h2>System Status</h2>
        <div class="value status" id="status">ACTIVE</div>
        <p>Monitoring sensors and actuators</p>
    </div>

</div>

<div style="text-align:center; margin-top:20px;">
    <button onclick="refillFood()">Refill Food</button>
    <button onclick="refillWater()">Refill Water</button>
</div>

<script>
let foodLevel = 100;
let waterLevel = 100;

function updateDisplay(){
    document.getElementById("food").innerText = foodLevel + "%";
    document.getElementById("water").innerText = waterLevel + "%";
}

// Simulate automatic consumption
setInterval(() => {

    foodLevel -= Math.floor(Math.random()*3);
    waterLevel -= Math.floor(Math.random()*2);

    // Automatic food supply
    if(foodLevel <= 20){
        foodLevel = 100;
        alert("Automatic Food Supply Activated!");
    }

    // Automatic water supply
    if(waterLevel <= 20){
        waterLevel = 100;
        alert("Automatic Water Supply Activated!");
    }

    updateDisplay();

}, 3000);

function refillFood(){
    foodLevel = 100;
    updateDisplay();
}

function refillWater(){
    waterLevel = 100;
    updateDisplay();
}
</script>

</body>
</html>
